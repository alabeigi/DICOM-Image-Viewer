<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#00BFA5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="8" y="8" width="164" height="164" rx="40" fill="url(#bg)"/>
  <!-- DICOM scan visualization -->
  <circle cx="90" cy="52" r="22" fill="white" opacity="0.9"/>
  <rect x="68" y="74" width="44" height="52" rx="22" fill="white" opacity="0.85"/>
  <line x1="56" y1="92" x2="124" y2="92" stroke="url(#bg)" stroke-width="2" opacity="0.5"/>
  <line x1="52" y1="104" x2="128" y2="104" stroke="url(#bg)" stroke-width="2" opacity="0.4"/>
  <rect x="40" y="98" width="100" height="4" rx="2" fill="white" opacity="0.65"/>
  <!-- Corner dots -->
  <circle cx="36" cy="36" r="5" fill="white" opacity="0.35"/>
  <circle cx="144" cy="36" r="5" fill="white" opacity="0.35"/>
  <circle cx="36" cy="144" r="5" fill="white" opacity="0.35"/>
  <circle cx="144" cy="144" r="5" fill="white" opacity="0.35"/>
</svg>
