<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#00BFA5"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#bg)"/>
  <!-- DICOM scan visualization: a stylized body/cross-section with scan lines -->
  <!-- Head circle -->
  <circle cx="24" cy="14" r="6" fill="white" opacity="0.9"/>
  <!-- Body -->
  <rect x="18" y="20" width="12" height="14" rx="6" fill="white" opacity="0.85"/>
  <!-- Scan line 1 -->
  <line x1="16" y1="24" x2="32" y2="24" stroke="url(#bg)" stroke-width="1" opacity="0.6"/>
  <!-- Scan line 2 -->
  <line x1="14" y1="28" x2="34" y2="28" stroke="url(#bg)" stroke-width="1" opacity="0.5"/>
  <!-- Bright horizontal scan line -->
  <rect x="10" y="26" width="28" height="1.5" rx="0.75" fill="white" opacity="0.7"/>
  <!-- Corner accent dots -->
  <circle cx="10" cy="10" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="38" cy="10" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="10" cy="38" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="38" cy="38" r="1.5" fill="white" opacity="0.4"/>
</svg>
